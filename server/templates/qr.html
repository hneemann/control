<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR-Code</title>
    <style>
        /* Seite komplett ausfüllen und Inhalt zentrieren */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f9;
        }

        /* Der Container bestimmt die Größe und bleibt strikt quadratisch */
        .qr-wrapper {
            /* 90vmin = 90% der kleineren Bildschirmseite (passt sich an Hoch- und Querformat an) */
            width: 90vmin;
            height: 90vmin;
            background: #ffffff;
            padding: 4vmin; /* Flexibler Innenrand */
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Sorgt dafür, dass das IMG-Tag den Platz ausfüllt und quadratisch bleibt */
        .qr-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Verhindert Verzerrungen */
            display: block;
        }
    </style>
</head>
<body>

    <div class="qr-wrapper">
        <img src="data:image/png;base64,{{.}}" alt="QR-Code" />
    </div>

</body>
</html>
